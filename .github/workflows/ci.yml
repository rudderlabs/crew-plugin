name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: send-list script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run the tests
        run: python3 -I "$GITHUB_WORKSPACE/plugins/crew/skills/send-list/scripts/test_send_leads.py" -v

  validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Plugin validation reads local files only. No sign-in or API key is set.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      # The CLI version lives in .github/ci/package.json and its lockfile.
      - name: Install Claude Code
        working-directory: .github/ci
        run: npm ci --no-audit --no-fund

      - name: Validate the plugin
        run: |
          "$GITHUB_WORKSPACE/.github/ci/node_modules/.bin/claude" --version
          "$GITHUB_WORKSPACE/.github/ci/node_modules/.bin/claude" plugin validate plugins/crew
