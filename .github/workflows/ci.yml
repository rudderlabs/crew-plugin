name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: send-list script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run the tests
        run: python3 -I "$GITHUB_WORKSPACE/plugins/crew/skills/send-list/scripts/test_send_leads.py" -v

  validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Plugin validation reads local files only. No sign-in or API key is set.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      # The CLI version lives in .github/ci/package.json and its lockfile.
      - name: Install Claude Code
        working-directory: .github/ci
        run: npm ci --no-audit --no-fund

      - name: Validate the plugin
        run: |
          "$GITHUB_WORKSPACE/.github/ci/node_modules/.bin/claude" --version
          "$GITHUB_WORKSPACE/.github/ci/node_modules/.bin/claude" plugin validate plugins/crew

  version:
    name: plugin version bumped
    # A pull request that changes the plugin must bump its version, or `claude plugin update`
    # leaves every install on the old files.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # The pull request's merge commit and its first parent, the base branch as it is now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check plugin.json's version moved up
        run: |
          manifest=plugins/crew/.claude-plugin/plugin.json
          if git diff --quiet HEAD^1 HEAD -- plugins/crew; then
            echo "Nothing under plugins/crew changed."
            exit 0
          fi
          base=$(git show "HEAD^1:$manifest" | jq -r .version)
          head=$(git show "HEAD:$manifest" | jq -r .version)
          # A plain MAJOR.MINOR.PATCH release, no leading zeros: a pre-release, build tag or missing
          # version cannot be ordered against the base by a numeric comparison.
          triplet='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          for v in "$base" "$head"; do
            if ! [[ "$v" =~ $triplet ]]; then
              echo "::error file=$manifest::version \"$v\" is not MAJOR.MINOR.PATCH (for example 0.8.1)."
              exit 1
            fi
          done
          IFS=. read -r b1 b2 b3 <<< "$base"
          IFS=. read -r h1 h2 h3 <<< "$head"
          if ! (( h1 > b1 || (h1 == b1 && (h2 > b2 || (h2 == b2 && h3 > b3))) )); then
            echo "::error file=$manifest::plugins/crew changed, but version is $head against the base branch's $base. Bump it above $base: a patch for wording, a minor for a new skill."
            exit 1
          fi
          echo "version $base -> $head"

  public-text:
    name: public text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Private repository names, internal hosts, UUIDs and PR numbers in what customers read.
      - name: Check the public text
        run: python3 -I .github/scripts/check_public_text.py

  self-approve:
    name: self-approve guard tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test self-approval guards
        run: bash .github/scripts/test-self-approve.sh
